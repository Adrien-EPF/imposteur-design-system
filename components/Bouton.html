<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@500;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--surface);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-4);padding:var(--space-6);align-items:center}
.btn{font-family:var(--font-sans);font-size:17px;line-height:20px;font-weight:800;min-height:56px;padding:0 var(--space-6);border-radius:var(--radius-pill);border:2px solid var(--ink);box-shadow:var(--shadow-sticker);cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-2);transition:transform 80ms ease-out,box-shadow 80ms ease-out}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--turquoise-deep);outline-offset:3px}
.primary{background:var(--turquoise);color:var(--ink)}
.secondary{background:var(--surface);color:var(--ink)}
.danger{background:var(--danger);color:var(--surface)}
.btn:disabled{background:var(--surface-tint);color:var(--ink-muted);border-color:var(--ink-muted);box-shadow:none;cursor:not-allowed}
</style></head>
<body><div class="row">
<button class="btn primary">Lancer la partie</button>
<button class="btn secondary">Personne n'est éliminé</button>
<button class="btn danger">Éliminer</button>
<button class="btn primary" disabled>Lancer la partie</button>
</div></body></html>
