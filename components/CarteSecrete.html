<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@500;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}
.wrap{display:flex;flex-direction:column;align-items:center;gap:var(--space-6);padding:var(--space-6)}
.hint{margin:0;font-size:18px;line-height:26px;font-weight:500}
.scene{width:300px;height:220px;perspective:900px}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 250ms ease-in}
.card.open{transform:rotateY(180deg);transition:transform 450ms cubic-bezier(.34,1.56,.64,1)}
.face{position:absolute;inset:0;border-radius:var(--radius-lg);backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);box-shadow:var(--shadow-card);border:2px solid var(--ink)}
.back{background:var(--turquoise);background-image:radial-gradient(circle at center, var(--surface-tint) 0 6px, transparent 7px);background-size:40px 40px}
.back span{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-4);font-family:var(--font-display);font-weight:800;font-size:24px}
.front{background:var(--lemon);transform:rotateY(180deg)}
.front small{font-size:14px;line-height:18px;font-weight:600;color:var(--ink)}
.front strong{max-width:calc(100% - 2 * var(--space-4));white-space:nowrap;font-family:var(--font-display);font-size:56px;line-height:60px;font-weight:800;letter-spacing:-.01em}
.btn{font-family:var(--font-sans);font-size:17px;line-height:20px;font-weight:800;min-height:56px;padding:0 var(--space-6);border-radius:var(--radius-pill);border:2px solid var(--ink);box-shadow:var(--shadow-sticker);cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-2);transition:transform 80ms ease-out,box-shadow 80ms ease-out}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--turquoise-deep);outline-offset:3px}
.primary{background:var(--turquoise);color:var(--ink)}
.secondary{background:var(--surface);color:var(--ink)}
.danger{background:var(--danger);color:var(--surface)}
.btn:disabled{background:var(--surface-tint);color:var(--ink-muted);border-color:var(--ink-muted);box-shadow:none;cursor:not-allowed}
@media (prefers-reduced-motion: reduce){.card,.card.open{transition:none}}
</style></head>
<body><div class="wrap">
<p class="hint" id="hint">Passe le téléphone à <b>Léa</b>. Les autres, on regarde ailleurs 👀</p>
<div class="scene"><div class="card" id="card">
<div class="face back"><span>?</span></div>
<div class="face front" aria-live="polite"><small>Ton mot</small><strong id="word"></strong><small>Chut.</small></div>
</div></div>
<button class="btn primary" id="act">Afficher mon mot</button>
</div>
<script>
function fit(){var w=document.getElementById('word'),s=56;w.style.fontSize=s+'px';while(w.scrollWidth>w.clientWidth&&s>28){s-=2;w.style.fontSize=s+'px';w.style.lineHeight=(s+4)+'px';}}
var card=document.getElementById('card'),act=document.getElementById('act'),word=document.getElementById('word'),hint=document.getElementById('hint');
act.addEventListener('click',function(){
  if(card.classList.contains('open')){word.textContent='';card.classList.remove('open');act.textContent='Afficher mon mot';act.className='btn primary';hint.innerHTML='Passe le téléphone à <b>Hugo</b>. Les autres, on regarde ailleurs 👀';}
  else{word.textContent='Orangina';fit();card.classList.add('open');act.textContent="J'ai mémorisé";act.className='btn secondary';hint.textContent='Mémorise-le bien…';}
});
</script></body></html>
